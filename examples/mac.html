<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }
      .new {
        font-size: 12px;
        font-weight: bold;

        color: orange;
        margin-top: 0;
        margin-bottom: 5px;
      }
      .mac {
        font-size: 20px;
        font-weight: 600;

        margin-top: 0;
        margin-bottom: 5px;
      }
      .super {
        font-size: 40px;
        font-weight: bolder;

        margin-top: 0;
        margin-bottom: 5px;
      }

      button {
        background-color: rgb(20, 30, 300);
        color: white;
        border-radius: 15px;
        border: blue;
        padding: 5px;
        width: 45px;
        cursor: pointer;
        text-align: center;
      }
    </style>
    <p class="new">New</p>
    <p class="mac">MacBook Pro</p>
    <p class="super">Supercharged for pros.</p>
    <p class="from">From $1999</p>
    <button>Buy</button>
  </body>
</html>
