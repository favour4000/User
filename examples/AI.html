<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: medium;
        font-weight: 200;
      }
      .first {
        display: inline;
        border-radius: 7px;
        font-size: 15px;
        margin-top: 10px;
        margin-bottom: 10px;
        padding: 10px;
        width: 100px;
      }
      .email {
        display: block;
        border-radius: 7px;
        font-size: 20px;
        margin-block-start: 5px;
        margin-bottom: 10px;
        padding: 10px;
      }
      button {
        display: block;
        border-radius: 7px;
        background-color: rgb(29, 87, 223);
        color: white;
        border: 2px;
        padding: 10px;
        width: 150px;
        height: 50px;
        font-size: 20px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <input class="first" type="text" placeholder="First name" />
    <input class="first" type="text" placeholder="First name" />
    <input class="email" type="text" placeholder="Email" />
    <button>Sign Up</button>
  </body>
</html>
